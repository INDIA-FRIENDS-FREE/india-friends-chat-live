 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ BlinkChat Mega Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://tailwindcss.com"></script>
    <style>.theme-transition { transition: all 0.5s ease; }</style>
</head>
<body id="bodyBg" class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans antialiased p-4 theme-transition">

    <div class="relative w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-5 flex flex-col h-[650px] justify-between z-10">
        
        <!-- Header Controls -->
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
            <div class="flex items-center gap-2">
                <div class="relative group cursor-pointer">
                    <img id="userDp" src="https://dicebear.com" class="w-10 h-10 rounded-full border-2 border-cyan-500 object-cover bg-slate-800" />
                    <label for="dpInput" class="absolute inset-0 bg-black/60 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] text-white font-bold">Edit</label>
                    <input type="file" id="dpInput" accept="image/*" class="hidden" onchange="loadDp(event)" />
                </div>
                <div>
                    <h2 class="text-sm font-bold">You (Me)</h2>
                    <p id="status" class="text-[10px] text-slate-400">Connecting...</p>
                </div>
            </div>

            <!-- View Once & Theme panel -->
            <div class="flex items-center gap-3">
                <!-- View Once Toggle Button -->
                <button id="viewOnceBtn" onclick="toggleViewOnce()" class="text-xs bg-slate-950 border border-slate-800 px-2 py-1 rounded-lg text-slate-400 hover:text-amber-400 transition" title="Toggle View Once Photo">
                    ⏱️ View Once: <span id="viewOnceStatus" class="text-red-500 font-bold">OFF</span>
                </button>
                <div class="flex gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
                    <button onclick="changeTheme('cyber')" class="w-4 h-4 rounded-full bg-cyan-500"></button>
                    <button onclick="changeTheme('mint')" class="w-4 h-4 rounded-full bg-emerald-500"></button>
                    <button onclick="changeTheme('purple')" class="w-4 h-4 rounded-full bg-purple-500"></button>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="messages" class="flex-1 my-3 overflow-y-auto space-y-3 pr-1 text-sm">
            <div class="text-center text-slate-500 text-xs mt-20">Tap 'Find Next Stranger' to start!</div>
        </div>

        <!-- Inputs Area -->
        <div class="space-y-3">
            <div class="flex gap-2 items-center bg-slate-950/80 border border-slate-800 rounded-2xl p-2">
                <!-- Attachment Button for Pics 📸 -->
                <label for="picInput" class="cursor-pointer text-slate-500 hover:text-cyan-400 p-1 transition">
                    📎
                    <input type="file" id="picInput" accept="image/*" class="hidden" onchange="sendPicture(event)" disabled />
                </label>

                <input 
                    type="text" 
                    id="msgInput" 
                    placeholder="Type a message..." 
                    class="flex-1 bg-transparent border-none outline-none text-slate-200 placeholder-slate-600 px-1 text-sm disabled:opacity-30"
                    disabled 
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                />
                <button id="sendBtn" onclick="sendMessage()" class="bg-cyan-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl disabled:opacity-20" disabled>Send</button>
            </div>

            <button id="nextBtn" onclick="findStranger()" class="w-full bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 font-bold py-2 rounded-xl text-sm">
                Find Next Stranger 🚀
            </button>
        </div>
    </div>

    <script>
        const socket = io(); 
        let currentRoom = null;
        let base64Dp = "https://dicebear.com";
        let viewOnceActive = false;

        const themes = {
            cyber: { bg: 'bg-slate-950', btn: 'bg-cyan-500', textBtn: 'text-slate-950', border: 'border-cyan-500', bubble: 'from-cyan-500 to-blue-600' },
            mint: { bg: 'bg-zinc-950', btn: 'bg-emerald-500', textBtn: 'text-slate-950', border: 'border-emerald-500', bubble: 'from-emerald-500 to-teal-600' },
            purple: { bg: 'bg-neutral-950', btn: 'bg-purple-600', textBtn: 'text-white', border: 'border-purple-500', bubble: 'from-purple-500 to-indigo-600' }
        };
        let activeTheme = 'cyber';

        function changeTheme(themeName) {
            activeTheme = themeName; const t = themes[themeName];
            document.getElementById('bodyBg').className = `${t.bg} text-slate-100 min-h-screen flex items-center justify-center font-sans p-4 theme-transition`;
            document.getElementById('userDp').className = `w-10 h-10 rounded-full border-2 ${t.border} object-cover bg-slate-800`;
            document.getElementById('sendBtn').className = `${t.btn} ${t.textBtn} font-bold text-xs px-4 py-2 rounded-xl disabled:opacity-20`;
        }

        function toggleViewOnce() {
            viewOnceActive = !viewOnceActive;
            const statusText = document.getElementById("viewOnceStatus");
            if(viewOnceActive) {
                statusText.innerText = "ON"; statusText.className = "text-amber-400 font-bold animate-pulse";
            } else {
                statusText.innerText = "OFF"; statusText.className = "text-red-500 font-bold";
            }
        }

        function loadDp(event) {
            const reader = new FileReader();
            reader.onload = function() { base64Dp = reader.result; document.getElementById('userDp').src = base64Dp; }
            reader.readAsDataURL(event.target.files);
        }

        socket.on("connect", () => { document.getElementById("status").innerHTML = '<span class="text-emerald-400">● Online</span>'; });

        function findStranger() {
            document.getElementById("messages").innerHTML = `<div class="text-center text-slate-600 text-xs animate-pulse mt-10">Searching for connection...</div>`;
            document.getElementById("msgInput").disabled = true;
            document.getElementById("sendBtn").disabled = true;
            document.getElementById("picInput").disabled = true;
            socket.emit("find-stranger");
        }

        socket.on("chat-start", (data) => {
            currentRoom = data.room;
            document.getElementById("status").innerHTML = '<span class="text-cyan-400">⚡ Matched</span>';
            document.getElementById("msgInput").disabled = false;
            document.getElementById("sendBtn").disabled = false;
            document.getElementById("picInput").disabled = false;
            document.getElementById("messages").innerHTML = `<div class="text-center text-slate-500 text-[11px] bg-slate-950/40 py-1 rounded-lg border border-slate-800/40">Connected with a stranger.</div>`;
        });

        // 📸 फोटो भेजने का फंक्शन
        function sendPicture(event) {
            const file = event.target.files[0];
            if (file && currentRoom) {
                const reader = new FileReader();
                reader.onload = function() {
                    const msgId = 'msg-' + Date.now();
                    const t = themes[activeTheme];
                    const msgDiv = document.getElementById("messages");

                    let contentHtml = `<img src="${reader.result}" class="max-w-[150px] rounded-lg border border-white/10" />`;
                    if(viewOnceActive) {
                        contentHtml = `<div class="bg-amber-500/20 text-amber-400 p-2 rounded-lg border border-amber-500/30 text-xs">⏱️ Sent a View Once Photo</div>`;
                    }

                    msgDiv.innerHTML += `
                        <div id="${msgId}" class="flex justify-end gap-2 items-end w-full group">
                            <button onclick="deleteMessage('${msgId}')" class="text-[10px] text-red-500 opacity-0 group-hover:opacity-100 transition mr-1">🗑️ Delete</button>
                            <div class="max-w-[70%] bg-gradient-to-br ${t.bubble} text-white rounded-2xl rounded-tr-none p-2 shadow-md">
                                ${contentHtml}
                            </div>
                            <img src="${base64Dp}" class="w-6 h-6 rounded-full" />
                        </div>`;

                    socket.emit("send-msg", { room: currentRoom, msgId: msgId, dp: base64Dp, isPic: true, picData: reader.result, viewOnce: viewOnceActive });
                    event.target.value = ""; // clear input
                    msgDiv.scrollTop = msgDiv.scrollHeight;
                }
                reader.readAsDataURL(file);
            }
        }

        function sendMessage() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (text && currentRoom) {
                const msgId = 'msg-' + Date.now();
                const t = themes[activeTheme];
                const msgDiv = document.getElementById("messages");
                
                msgDiv.innerHTML += `
                    <div id="${msgId}" class="flex justify-end gap-2 items-end w-full group">
                        <button onclick="deleteMessage('${msgId}')" class="text-[10px] text-red-500 opacity-0 group-hover:opacity-100 transition mr-1">🗑️ Delete</button>
