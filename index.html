<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Friends Chat</title>
    <!-- Firebase के लाइव ग्लोबल सर्वर की स्क्रिप्ट्स (जो हर फोन, टैबलेट और कंप्यूटर को जोड़ेंगी) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        :root {
            --bg-color: #0b141a;
            --container-bg: #111b21;
            --header-bg: #202c33;
            --input-bg: #2a3942;
            --text-color: #e9edef;
            --sent-msg: #005c4b;
            --received-msg: #202c33;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: var(--container-bg);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background-color: var(--header-bg);
            padding: 15px;
            font-weight: bold;
            color: #00a884;
            font-size: 1.2rem;
            text-align: center;
        }
        .status-bar {
            background-color: rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            color: #ffd27d;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 75%;
            font-size: 0.95rem;
        }
        .message.received { background-color: var(--received-msg); align-self: flex-start; }
        .message.sent { background-color: var(--sent-msg); align-self: flex-end; }
        .message.system { background-color: transparent; color: #8696a0; align-self: center; text-align: center; font-size: 0.85rem; }
        .chat-input-area {
            background-color: var(--header-bg);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            background-color: var(--input-bg);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
        }
        .send-btn, .next-btn {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .send-btn { background-color: #00a884; color: #111b21; }
        .next-btn { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">India Friends Chat 💬</div>
    <div class="status-bar" id="statusText">ग्लोबल सर्वर एक्टिव है। नीचे Next बटन दबाएं। 📡</div>
    <div class="chat-messages" id="chatBox">
        <div class="message system">India Friends Chat नेटवर्क में आपका स्वागत है भाई! 🙏</div>
    </div>
    <div class="chat-input-area">
        <button class="next-btn" id="nextBtn" onclick="findStranger()">Next</button>
        <input type="text" class="chat-input" id="messageInput" placeholder="यहाँ अपना संदेश लिखें...">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">भेजें</button>
    </div>
</div>

<script>
    // बिल्कुल फ्री और ओपन ग्लोबल लाइव डेटाबेस सर्वर कॉन्फ़िगरेशन
    const firebaseConfig = { databaseURL: "https://firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let chatRef, myId = Math.random().toString(36).substring(2, 9), strangerId = null;

    function findStranger() {
        document.getElementById("chatBox").innerHTML = '<div class="message system">ऑनलाइन अजनबियों की तलाश जारी है... 🔍</div>';
        document.getElementById("statusText").innerText = "Connecting...";
        
        db.ref("waiting").once("value", snapshot => {
            let waitingUser = snapshot.val();
            if (waitingUser && waitingUser !== myId) {
                strangerId = waitingUser;
                db.ref("waiting").remove();
                startChat(myId + "_" + strangerId);
            } else {
                db.ref("waiting").set(myId);
                db.ref("waiting").on("value", snap => {
                    if (!snap.exists() && !strangerId) {
                        db.ref("rooms").once("value", roomsSnap => {
                            roomsSnap.forEach(room => {
                                if (room.key.includes(myId)) {
                                    strangerId = room.key.replace(myId, "").replace("_", "");
                                    startChat(room.key);
                                }
                            });
                        });
                    }
                });
            }
        });
    }

    function startChat(roomId) {
        document.getElementById("statusText").innerText = "अजनबी मिल गया! बातचीत शुरू करें। 👥";
        document.getElementById("chatBox").innerHTML += '<div class="message system">लाइव यूज़र कनेक्ट हो चुका है! अपना संदेश भेजें।</div>';
        
        chatRef = db.ref("rooms/" + roomId);
        chatRef.on("child_added", snap => {
            let msgData = snap.val();
            if (msgData.sender !== myId) {
                showMsg(msgData.text, "received");
            }
        });
    }

    function sendMessage() {
        let txt = document.getElementById("messageInput").value.trim();
        if (txt !== "" && chatRef) {
            chatRef.push({ sender: myId, text: txt });
            showMsg(txt, "sent");
            document.getElementById("messageInput").value = "";
        }
    }

    function showMsg(text, type) {
        let div = document.createElement("div");
        div.className = "message " + type;
        div.innerText = text;
        document.getElementById("chatBox").appendChild(div);
        document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;
    }

    document.getElementById("messageInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") { sendMessage(); }
    });
</script>

</body>
</html>
