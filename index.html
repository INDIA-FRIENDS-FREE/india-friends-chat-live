 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Friends Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .chat-box { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 5px; margin-top: 10px; }
        #messages { height: 200px; overflow-y: auto; border: 1px solid #333; margin: 10px 0; padding: 10px; text-align: left; }
    </style>
</head>
<body>

    <div class="chat-box">
        <h2>Welcome to Friends Chat!</h2>
        <div id="status">सर्वर से जुड़ रहे हैं...</div>
        <div id="messages"></div>
        <button id="nextBtn" onclick="findStranger()">Next 📷</button>
    </div>

    <script>
        // Render के लिए सबसे ज़रूरी बदलाव (ब्रैकेट खाली रखा है ताकि यह ऑटो-कनेक्ट हो)
        const socket = io(); 
        let currentRoom = null;

        socket.on("connect", () => {
            document.getElementById("status").innerText = "सर्वर से कनेक्टेड। 'Next' दबाएं।";
        });

        function findStranger() {
            document.getElementById("messages").innerHTML = "";
            socket.emit("find-stranger");
        }

        socket.on("waiting-status", (msg) => {
            document.getElementById("status").innerText = msg;
        });

        socket.on("chat-start", (data) => {
            currentRoom = data.room;
            document.getElementById("status").innerText = "अजनबी मिल गया! चैट शुरू करें।";
            // यहाँ आप मैसेज भेजने या इनपुट दिखाने का लॉजिक डाल सकते हैं
        });

        socket.on("receive-msg", (text) => {
            const msgDiv = document.getElementById("messages");
            msgDiv.innerHTML += `<p><b>अजनबी:</b> ${text}</p>`;
        });
    </script>
</body>
</html>
