     <script>
        // रेलवे के पोर्ट और प्रोटोकॉल को जबरदस्ती जोड़ने का अचूक कोड
        const socket = io(window.location.origin, {
            transports: ['websocket', 'polling']
        }); 
        let currentRoom = null;
        let soundEnabled = true;
        let pinkActive = false;

        function playBeep() {
            if (!soundEnabled) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = 587.33;
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.15);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.15);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById("soundBtn").innerText = soundEnabled ? "🔊 Sound" : "🔇 Mute";
        }

        function togglePinkTheme() {
            pinkActive = !pinkActive;
            const box = document.querySelector('.chat-box');
            if (pinkActive) {
                document.body.style.background = "#0f051d";
                box.style.borderColor = "rgba(236, 72, 153, 0.3)";
                box.style.boxShadow = "0 0 30px rgba(236, 72, 153, 0.2)";
            } else {
                document.body.style.background = "#020617";
                box.style.borderColor = "rgba(6, 182, 212, 0.2)";
                box.style.boxShadow = "0 0 30px rgba(6, 182, 212, 0.2)";
            }
        }

        socket.on("connect", () => {
            document.getElementById("status").innerHTML = '<span style="color:#10b981; font-weight:bold;">● Connected</span>';
        });

        function findStranger() {
            document.getElementById("messages").innerHTML = "";
            document.getElementById("msgInput").disabled = true;
            document.getElementById("sendBtn").disabled = true;
            socket.emit("find-stranger");
        }

        socket.on("waiting-status", (msg) => {
            document.getElementById("status").innerHTML = '<span style="color:#fbbf24; font-weight:bold;">🔍 Searching match...</span>';
        });

        socket.on("chat-start", (data) => {
            currentRoom = data.room;
            document.getElementById("status").innerHTML = '<span style="color:#22d3ee; font-weight:bold;">⚡ Matched!</span>';
            document.getElementById("msgInput").disabled = false;
            document.getElementById("sendBtn").disabled = false;
            document.getElementById("msgInput").focus();
            document.getElementById("messages").innerHTML = '<div class="sys-msg">🔒 Secured room created. Chat started.</div>';
            playBeep();
        });

        function sendMessage() {
            const input = document.getElementById("msgInput");
            const nameInput = document.getElementById("usernameInput");
            const myName = nameInput.value.trim() || "You";
            const text = input.value.trim();
            
            if (text && currentRoom) {
                const msgDiv = document.getElementById("messages");
                msgDiv.innerHTML += `<div class="msg-p msg-me"><span style="font-size:10px; color:#64748b; margin-bottom:2px;">${myName}</span><div class="bubble b-me">${text}</div></div>`;
                socket.emit("send-msg", { room: currentRoom, text: text });
                input.value = "";
                msgDiv.scrollTop = msgDiv.scrollHeight;
            }
        }

        socket.on("receive-msg", (text) => {
            const msgDiv = document.getElementById("messages");
            msgDiv.innerHTML += `<div class="msg-p msg-stranger"><span style="font-size:10px; color:#64748b; margin-bottom:2px;">Stranger</span><div class="bubble b-stranger">${text}</div></div>`;
            msgDiv.scrollTop = msgDiv.scrollHeight;
            playBeep();
        });
    </script>
